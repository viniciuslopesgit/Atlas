name: Deploy Site

on:
  push:
    branches:
      - main
    paths:
      - 'cloud-atlas.io/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inject latest version into website
        run: |
          LATEST=$(git describe --tags --abbrev=0 2>/dev/null || echo "0.0.1")
          sed -i "s/__VERSION__/$LATEST/g" cloud-atlas.io/index.html

      - name: Deploy to atlas-site repo
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          rm -rf deploy-repo
          git clone https://x-access-token:${DEPLOY_TOKEN}@github.com/viniciuslopesgit/atlas-site.git deploy-repo

          rsync -av --delete cloud-atlas.io/ deploy-repo/

          cd deploy-repo
          git add .
          git commit -m "Deploy site update from atlas-cloud" || echo "No changes to commit"
          git push origin main