name: Deploy Site

on:
  push:
    branches:
      - main
    paths:
      - 'cloud-atlas.io/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-tags: true

      - name: Inject latest version into website
        run: |
          LATEST=$(git describe --tags --abbrev=0 2>/dev/null || echo "0.0.1")
          sed -i "s/{{VERSION}}/$LATEST/g" cloud-atlas.io/index.html

      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v3
        with:
          publish-dir: cloud-atlas.io
          production-branch: main
          production-deploy: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
