name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'   # dispara em tags tipo 0.0.8

jobs:
  build-sign-release:
    runs-on: windows-latest
    permissions:
      id-token: write
      contents: write
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Get version from tag
        id: version
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF -replace 'refs/tags/', ''
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT
          echo "Version: $version"

      - name: Override nuget.config for CI
        shell: pwsh
        run: |
          @"
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
            </packageSources>
          </configuration>
          "@ | Set-Content nuget.config

      - name: Install vpk
        run: dotnet tool install -g vpk

      - name: Publish
        run: dotnet publish Atlas/Atlas.csproj -c Release -r win-x64 --self-contained -o publish/

      - name: Pack with Velopack
        shell: pwsh
        run: |
          $env:PATH += ";$env:USERPROFILE\.dotnet\tools"
          vpk pack `
            --packId Atlas `
            --packVersion ${{ steps.version.outputs.VERSION }} `
            --packDir publish/ `
            --outputDir releases/

      - name: Upload unsigned artifacts
        id: upload-artifact
        uses: actions/upload-artifact@v4
        with:
          name: releases-unsigned
          path: releases/

      - name: Sign with SignPath
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORG_ID }}
          project-slug: Atlas
          signing-policy-slug: release
          artifact-configuration-slug: initial
          github-artifact-id: ${{ steps.upload-artifact.outputs.artifact-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          wait-for-completion: true
          output-artifact-directory: releases-signed/
          service-unavailable-timeout-in-seconds: 600

      - name: Upload to GitHub Releases (public repo)
        shell: pwsh
        run: |
          $env:PATH += ";$env:USERPROFILE\.dotnet\tools"
          vpk upload github `
            --repoUrl https://github.com/viniciuslopesgit/atlas-cloud `
            --token ${{ secrets.RELEASES_TOKEN }} `
            --outputDir releases-signed/ `
            --publish
