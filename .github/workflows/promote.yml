name: Promote to main

# Every 6 hours: the most recent beta that meets docs/RELEASE_CRITERIA.md (rules in Atlas/scripts/stable.py) is
# approved automatically, checked again in a clean copy and goes to main as "Atlas X.Y.Z (stable version)",
# with only the files needed to build it (.mainignore), through a Pull Request. Its Release is published as
# stable ("Latest"). Nobody has to approve: a new major version waits 72 h instead of 24 h, and an open issue
# labelled "hold-release" stops the promotion (of the version it names, or of every version if it names none).
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      approve:
        description: 'Approve a new major version now, without the 72 h soak (X.Y.Z)'
        default: ''
      dry_run:
        description: 'Only rehearse the promotion of this version (X.Y.Z)'
        default: ''

concurrency:
  group: promote
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: read
  actions: write

jobs:
  promote:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Latest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"

      - name: Stable version
        env:
          GH_TOKEN: ${{ github.token }}
          STABLE_APPROVE: ${{ inputs.approve }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          OLD_MAIN=$(git rev-parse origin/main)
          if [ -n "$DRY_RUN" ]; then
            Atlas/scripts/stable.sh --dry-run "$DRY_RUN"
            exit 0
          fi
          Atlas/scripts/stable.sh --apply | tee -a "$GITHUB_STEP_SUMMARY"
          git fetch -q origin main
          # Pushes made with GITHUB_TOKEN do not trigger workflows: publish the site if it changed.
          if ! git diff --quiet "$OLD_MAIN" origin/main -- cloud-atlas.io; then
            gh workflow run deploy-site.yml --ref main
          fi
