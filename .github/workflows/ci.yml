name: CI

# Every push and Pull Request to dev: the full check (Atlas/scripts/check.sh --full) on macOS 14 and 15, then the
# checked app on macOS 12, the oldest macOS Atlas supports (the "macos12" job).
# On a push to dev, a version that has no Release yet is published as a beta (pre-release) with the app
# that was just checked: Atlas-X.Y.Z.dmg (the installer) with its .sha256, Atlas-X.Y.Z.zip with SHA256SUMS (what
# the automatic updater downloads) and the notes from its CHANGELOG section.
# A push that changed the app after a published version without a new one (a Pull Request merged on GitHub)
# first gets its version automatically: the "version" job commits it and runs CI again on that commit.
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  version:
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: macos-15
    permissions:
      contents: write
      actions: write
    outputs:
      bumped: ${{ steps.bump.outputs.bumped }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: New version when the app changed
        id: bump
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(Atlas/scripts/version.sh)
          if ! git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null \
             || git diff --quiet "refs/tags/$VERSION" -- Atlas/Sources Atlas/Resources Atlas/Package.swift; then
            echo "bumped=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          Atlas/scripts/bump_version.sh --auto
          NEW=$(Atlas/scripts/version.sh)
          git commit -qam "chore(release): $NEW"
          git push -q origin HEAD:refs/heads/dev
          # Pushes made with GITHUB_TOKEN do not start workflows: run CI on the new commit explicitly.
          gh workflow run ci.yml --ref dev
          echo "bumped=true" >> "$GITHUB_OUTPUT"
          echo "### Atlas $NEW: version created from the commits; CI runs again on that commit" >> "$GITHUB_STEP_SUMMARY"

  check:
    needs: version
    if: ${{ !cancelled() && needs.version.outputs.bumped != 'true' }}
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags: a published version cannot change without a new version

      - name: Latest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          echo "Using $XCODE"; swift --version

      - name: Full check
        run: Atlas/scripts/check.sh --full

      - name: Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: check-logs-${{ matrix.os }}
          path: |
            Atlas/.build/check-*.log
            Atlas/.build/isolated-build.log
          retention-days: 14

      - name: Package the checked app
        if: matrix.os == 'macos-15'
        working-directory: Atlas
        run: |
          VERSION=$(scripts/version.sh)
          scripts/make-dmg.sh "$VERSION"
          ditto -c -k --keepParent dist/Atlas.app "dist/Atlas-$VERSION.zip"
          # SHA256SUMS keeps only the zip: installed updaters run `shasum -c` on it and would fail on a file
          # they did not download. The installer gets its own checksum file.
          (cd dist && shasum -a 256 "Atlas-$VERSION.zip" > SHA256SUMS && shasum -a 256 "Atlas-$VERSION.dmg" > "Atlas-$VERSION.dmg.sha256")
          scripts/release_notes.sh "$VERSION" --beta > dist/NOTES.md
          echo "$VERSION" > dist/VERSION
          echo "Swift: $(swift --version 2>&1 | head -1) · $(sw_vers -productName) $(sw_vers -productVersion)" >> dist/NOTES.md

      - uses: actions/upload-artifact@v4
        if: matrix.os == 'macos-15'
        with:
          name: release
          path: |
            Atlas/dist/Atlas-*.dmg
            Atlas/dist/Atlas-*.dmg.sha256
            Atlas/dist/Atlas-*.zip
            Atlas/dist/SHA256SUMS
            Atlas/dist/NOTES.md
            Atlas/dist/VERSION
          retention-days: 30

  # The app built and checked above, on the oldest macOS it supports. GitHub no longer offers macOS 12 runners: with a
  # self-hosted Mac on macOS 12, set the repository variable MACOS12_RUNNER to its labels as JSON (for example
  # ["self-hosted", "macOS", "monterey"]) and the app is started there. Until then it runs on macos-15, where it
  # checks that the binary is built for macOS 12 and needs nothing newer (min-os.sh), and says so in the summary.
  macos12:
    needs: check
    if: ${{ !cancelled() && needs.check.result == 'success' }}
    name: macOS 12
    runs-on: ${{ vars.MACOS12_RUNNER && fromJSON(vars.MACOS12_RUNNER) || 'macos-15' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4 # min-os.sh, selftest.sh and Package.swift

      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release

      - name: Unpack the checked app
        run: ditto -x -k release/Atlas-*.zip "$RUNNER_TEMP/app"

      - name: Built for macOS 12
        run: Atlas/scripts/min-os.sh "$RUNNER_TEMP/app/Atlas.app"

      - name: Starts and passes its self-test
        run: Atlas/scripts/selftest.sh "$RUNNER_TEMP/app/Atlas.app" "$RUNNER_TEMP/selftest.log"

      - name: Summary
        if: always()
        run: |
          OS="$(sw_vers -productName) $(sw_vers -productVersion)"
          if [[ $(sw_vers -productVersion) == 12.* ]]; then
            echo "### Atlas started and passed its self-test on $OS" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Atlas is built for macOS 12; started on $OS (no macOS 12 runner: see MACOS12_RUNNER in ci.yml)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: selftest-macos12
          path: ${{ runner.temp }}/selftest.log
          retention-days: 14

  release:
    needs: [check, macos12]
    if: ${{ !cancelled() && needs.check.result == 'success' && needs.macos12.result == 'success' && github.ref == 'refs/heads/dev' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release

      - name: Beta Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION=$(cat VERSION)
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Atlas $VERSION is already published: nothing to release (the app did not change)."
            exit 0
          fi
          # Published as a pre-release (beta): it only becomes "Latest" when promote.yml makes it stable.
          gh release create "$VERSION" "Atlas-$VERSION.dmg" "Atlas-$VERSION.dmg.sha256" "Atlas-$VERSION.zip" SHA256SUMS \
            --target "$GITHUB_SHA" --prerelease --title "Atlas $VERSION" --notes-file NOTES.md
          echo "### Atlas $VERSION published as beta" >> "$GITHUB_STEP_SUMMARY"
