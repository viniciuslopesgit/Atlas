name: CI

# Every push and Pull Request to dev: the full check (Atlas/scripts/check.sh --full) on macOS 14 and 15.
# On a push to dev, a version that has no Release yet is published as a beta (pre-release) with the app
# that was just checked, Atlas-X.Y.Z.zip, SHA256SUMS and the notes from its CHANGELOG section.
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags: a published version cannot change without a new version

      - name: Latest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          echo "Using $XCODE"; swift --version

      - name: Full check
        run: Atlas/scripts/check.sh --full

      - name: Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: check-logs-${{ matrix.os }}
          path: |
            Atlas/.build/check-*.log
            Atlas/.build/isolated-build.log
          retention-days: 14

      - name: Package the checked app
        if: matrix.os == 'macos-15'
        working-directory: Atlas
        run: |
          VERSION=$(scripts/version.sh)
          ditto -c -k --keepParent dist/Atlas.app "dist/Atlas-$VERSION.zip"
          (cd dist && shasum -a 256 "Atlas-$VERSION.zip" > SHA256SUMS)
          scripts/release_notes.sh "$VERSION" --beta > dist/NOTES.md
          echo "$VERSION" > dist/VERSION
          echo "Swift: $(swift --version 2>&1 | head -1) · $(sw_vers -productName) $(sw_vers -productVersion)" >> dist/NOTES.md

      - uses: actions/upload-artifact@v4
        if: matrix.os == 'macos-15'
        with:
          name: release
          path: |
            Atlas/dist/Atlas-*.zip
            Atlas/dist/SHA256SUMS
            Atlas/dist/NOTES.md
            Atlas/dist/VERSION
          retention-days: 30

  release:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release

      - name: Beta Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION=$(cat VERSION)
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Atlas $VERSION is already published: nothing to release (the app did not change)."
            exit 0
          fi
          # Published as a pre-release (beta): it only becomes "Latest" when promote.yml makes it stable.
          gh release create "$VERSION" "Atlas-$VERSION.zip" SHA256SUMS \
            --target "$GITHUB_SHA" --prerelease --title "Atlas $VERSION" --notes-file NOTES.md
          echo "### Atlas $VERSION published as beta" >> "$GITHUB_STEP_SUMMARY"
